<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loud Haus — Strategic Brand Partnerships</title>
<meta name="description" content="Loud Haus is a boutique brand partnerships consultancy connecting brands with fashion, cultural and entertainment experiences.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A0D19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;800&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../img/gq-wall.webp">
<style>
:root{
  --ox:#4A0D19;
  --ox-deep:#310810;
  --cream:#EDE8E2;
  --rule:rgba(237,232,226,.22);
  --display:"Poppins",system-ui,sans-serif;
  --body:"Fraunces",Georgia,serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ox);color:var(--cream);
  font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--cream);color:var(--ox)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

.stage{display:flex;height:100svh;width:100%;position:relative}

/* ---------- signature: the press wall ---------- */
.wall{
  position:absolute;inset:0;overflow:hidden;z-index:0;
  background:var(--ox);
  -webkit-user-select:none;user-select:none;pointer-events:none;
}
.wall .row{
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(30px,3.6vw,58px);line-height:1.9;letter-spacing:-.02em;
  white-space:nowrap;color:var(--cream);opacity:.055;
}
.wall .row:nth-child(even){transform:translateX(-11%)}
.wall::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 18% 46%,rgba(49,8,16,0) 0%,rgba(49,8,16,.55) 72%);
}

/* ---------- left: the brand ---------- */
.panel{
  position:relative;z-index:2;
  flex:1 1 46%;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(22px,3.4vw,54px);
}
.mark{
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(2.6rem,6.4vw,6.4rem);line-height:.84;letter-spacing:-.045em;
}
.mark span{display:block;overflow:hidden}
.mark span i{display:block;font-style:normal;transform:translateY(104%)}
.ready .mark span i{transform:none;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.ready .mark span:nth-child(2) i{transition-delay:.08s}

.lede{
  font-size:clamp(1.02rem,1.45vw,1.35rem);line-height:1.45;max-width:22ch;
  margin-top:clamp(16px,2vw,26px);opacity:0;
}
.ready .lede{opacity:.92;transition:opacity .9s ease .5s}

.foot{display:flex;flex-direction:column;gap:clamp(16px,2vw,26px)}
nav{display:flex;gap:clamp(16px,2.2vw,34px);flex-wrap:wrap}
nav a{
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  padding-bottom:5px;border-bottom:1px solid transparent;transition:border-color .3s,opacity .3s;
  opacity:.72;
}
nav a:hover{opacity:1;border-bottom-color:var(--cream)}
.meta{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;opacity:.42;
}

/* ---------- right: the subject at the wall ---------- */
.plate{
  position:relative;z-index:2;
  flex:1 1 54%;min-width:0;
  overflow:hidden;background:var(--ox-deep);
}
.plate img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 32%;
  opacity:0;transition:opacity .9s ease;
}
.plate img.on{opacity:1}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(49,8,16,.5) 0%,rgba(49,8,16,0) 22%);
}

.caption{
  position:absolute;z-index:3;left:clamp(16px,2vw,28px);bottom:clamp(16px,2vw,28px);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--cream);opacity:.6;text-shadow:0 1px 12px rgba(0,0,0,.6);
  max-width:70%;
}
.bar{
  position:absolute;z-index:3;left:0;right:0;bottom:0;height:2px;
  background:rgba(237,232,226,.18);
}
.bar i{display:block;height:100%;width:0;background:var(--cream)}
.playing .bar i{animation:fill 4.6s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}

.dots{
  position:absolute;z-index:3;right:clamp(16px,2vw,28px);bottom:clamp(18px,2vw,30px);
  display:flex;gap:7px;
}
.dots button{
  all:unset;width:7px;height:7px;border:1px solid rgba(237,232,226,.55);
  cursor:pointer;transition:background .3s;
}
.dots button[aria-current="true"]{background:var(--cream)}
.dots button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

/* ---------- mobile: subject fills the frame, wall behind the type ---------- */
@media(max-width:820px){
  .stage{flex-direction:column}
  .plate{
    position:absolute;inset:0;z-index:1;flex:none;
  }
  .plate img{object-position:50% 26%}
  .plate::after{
    background:linear-gradient(180deg,rgba(49,8,16,.62) 0%,rgba(49,8,16,.12) 34%,rgba(49,8,16,.9) 78%,var(--ox) 100%);
  }
  .panel{
    flex:1;z-index:2;justify-content:flex-end;
    padding:clamp(20px,5vw,34px);
    text-shadow:0 2px 18px rgba(0,0,0,.5);
  }
  .lede{max-width:26ch}
  .caption{display:none}
  .dots{bottom:auto;top:clamp(18px,4vw,26px);right:clamp(18px,4vw,26px)}
  .bar{top:0;bottom:auto}
  .wall .row{opacity:.05}
}

@media(prefers-reduced-motion:reduce){
  .mark span i,.lede{transform:none!important;opacity:1!important;transition:none!important}
  .plate img{transition:none}
  .playing .bar i{animation:none;width:100%}
}
</style>
</head>
<body>

<div class="stage">
  <div class="wall" aria-hidden="true" id="wall"></div>

  <div class="panel">
    <div>
      <h1 class="mark"><span><i>Loud</i></span><span><i>Haus.</i></span></h1>
      <p class="lede">Strategic brand partnerships for fashion, culture and entertainment.</p>
    </div>
    <div class="foot">
      <nav>
        <a href="../#about">About</a>
        <a href="../#services">Services</a>
        <a href="../#projects">Work</a>
        <a href="../#contact">Contact</a>
      </nav>
      <span class="meta">London &mdash; hello@loudhaus.com</span>
    </div>
  </div>

  <div class="plate" id="plate">
    <span class="caption" id="cap"></span>
    <div class="dots" id="dots"></div>
    <div class="bar"><i></i></div>
  </div>
</div>

<script>
(function(){
  var shots=[
    ['../img/gq-wall.webp','GQ Men of the Year'],
    ['../img/wc-krept-claw.webp','Krept x White Claw'],
    ['../img/sb-wall.webp','Dami Hope x Snowbunny'],
    ['../img/gq-portrait.webp','GQ Men of the Year'],
    ['../img/wc-guests.webp','Krept x White Claw'],
    ['../img/gq-arrival.webp','GQ Men of the Year'],
    ['../img/wc-canwall.webp','Krept x White Claw'],
    ['../img/wc-krept-stage.webp','Krept x White Claw'],
    ['../img/gq-detail.webp','GQ Men of the Year'],
    ['../img/wc-clawmachine.webp','Krept x White Claw']
  ];

  /* press wall */
  var wall=document.getElementById('wall'), unit='Loud Haus.&nbsp;&nbsp;&nbsp;', html='';
  for(var r=0;r<16;r++){ html+='<div class="row">'+unit.repeat(10)+'</div>'; }
  wall.innerHTML=html;

  var plate=document.getElementById('plate'),
      cap=document.getElementById('cap'),
      dots=document.getElementById('dots'),
      imgs=[], i=0, timer=null,
      reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  shots.forEach(function(s,n){
    var im=new Image();
    im.src=s[0]; im.alt=s[1]; im.decoding='async';
    if(n>1) im.loading='lazy';
    plate.insertBefore(im, plate.firstChild);
    imgs.push(im);

    var d=document.createElement('button');
    d.type='button';
    d.setAttribute('aria-label','Show image '+(n+1)+' of '+shots.length);
    d.addEventListener('click',function(){ go(n,true); });
    dots.appendChild(d);
  });

  function go(n,manual){
    imgs[i].classList.remove('on');
    dots.children[i].removeAttribute('aria-current');
    i=(n+imgs.length)%imgs.length;
    imgs[i].classList.add('on');
    dots.children[i].setAttribute('aria-current','true');
    cap.textContent=shots[i][1];
    if(!reduced){
      plate.classList.remove('playing'); void plate.offsetWidth; plate.classList.add('playing');
    }
    if(manual) restart();
  }
  function restart(){ clearInterval(timer); if(!reduced) timer=setInterval(function(){ go(i+1); },4600); }

  imgs[0].addEventListener('load', function(){ document.body.classList.add('ready'); });
  if(imgs[0].complete) document.body.classList.add('ready');

  go(0); restart();

  plate.addEventListener('mouseenter',function(){ clearInterval(timer); plate.classList.remove('playing'); });
  plate.addEventListener('mouseleave',restart);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) clearInterval(timer); else restart();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight') go(i+1,true);
    if(e.key==='ArrowLeft') go(i-1,true);
  });

  /* swipe on mobile */
  var x0=null;
  plate.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  plate.addEventListener('touchend',function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>44) go(dx<0?i+1:i-1,true);
  },{passive:true});
})();
</script>
</body>
</html>
