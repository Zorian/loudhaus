<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loud Haus</title>
<meta name="description" content="Brand partnerships consultancy for fashion, culture and entertainment. London.">
<meta property="og:title" content="Loud Haus">
<meta property="og:description" content="Brand partnerships consultancy for fashion, culture and entertainment.">
<meta property="og:image" content="https://zorian.github.io/loudhaus/img/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4A0D19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/gq-wall.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234A0D19'/%3E%3Ccircle cx='50' cy='58' r='20' fill='%23EDE8E2'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Poppins",system-ui,sans-serif;background:#310810;color:#EDE8E2;overflow:hidden}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid #EDE8E2;outline-offset:4px}
  .show{position:fixed;inset:0}
  .show img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1s ease}
  .show img.on{opacity:1}
  .scrim{position:fixed;inset:0;background:
    linear-gradient(180deg,rgba(49,8,16,.42) 0%,rgba(49,8,16,.06) 32%,rgba(49,8,16,.12) 62%,rgba(49,8,16,.62) 100%)}
  .logo{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.84;
    font-size:clamp(3.2rem,13vw,11rem);text-align:center;
    text-shadow:0 4px 40px rgba(0,0,0,.4);white-space:nowrap;
  }
  .menu{
    position:fixed;bottom:clamp(20px,3.5vw,44px);left:0;right:0;
    display:flex;justify-content:center;gap:clamp(20px,3.5vw,52px);
    font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  }
  .menu a{opacity:.78;padding-bottom:4px;border-bottom:1px solid transparent;transition:.3s}
  .menu a:hover{opacity:1;border-bottom-color:#EDE8E2}
  .dots{position:fixed;top:clamp(18px,3vw,30px);left:50%;transform:translateX(-50%);display:flex;gap:6px}
  .dots button{all:unset;width:6px;height:6px;border:1px solid rgba(237,232,226,.5);cursor:pointer}
  .dots button[aria-current="true"]{background:#EDE8E2}
  .dots button:focus-visible{outline:2px solid #EDE8E2;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.show img{transition:none}}
</style>
</head>
<body>
<div class="show" id="show"></div>
<div class="scrim"></div>
<h1 class="logo">Loud<br>Haus.</h1>
<div class="dots" id="dots" role="group" aria-label="Choose image"></div>
<nav class="menu">
  <a href="who.html">Who</a>
  <a href="work.html">Work</a>
  <a href="contact.html">Contact</a>
</nav>
<script>
(function(){
  var src=['gq-wall','wc-krept-claw','sb-wall','gq-portrait','wc-guests','gq-arrival',
           'wc-canwall','wc-krept-stage','gq-detail','wc-clawmachine'];
  var pos={'gq-wall':'62% 40%','wc-krept-claw':'44% 34%','sb-wall':'52% 40%','gq-portrait':'50% 34%',
           'wc-guests':'50% 38%','gq-arrival':'50% 30%','wc-canwall':'50% 50%','wc-krept-stage':'50% 40%',
           'gq-detail':'50% 45%','wc-clawmachine':'50% 46%'};
  var show=document.getElementById('show'), dots=document.getElementById('dots'),
      imgs=[], i=0, timer=null,
      reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  src.forEach(function(name,n){
    var im=new Image();
    im.src='img/'+name+'.webp'; im.alt=''; im.decoding='async';
    im.style.objectPosition=pos[name]||'50% 40%';
    if(n>1) im.loading='lazy';
    show.appendChild(im); imgs.push(im);
    var d=document.createElement('button');
    d.type='button'; d.setAttribute('aria-label','Image '+(n+1)+' of '+src.length);
    d.addEventListener('click',function(){ go(n,true); });
    dots.appendChild(d);
  });

  function go(n,manual){
    imgs[i].classList.remove('on'); dots.children[i].removeAttribute('aria-current');
    i=(n+imgs.length)%imgs.length;
    imgs[i].classList.add('on'); dots.children[i].setAttribute('aria-current','true');
    if(manual) run();
  }
  function run(){ clearInterval(timer); if(!reduced) timer=setInterval(function(){ go(i+1); },4200); }

  go(0); run();
  document.addEventListener('visibilitychange',function(){ document.hidden?clearInterval(timer):run(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight') go(i+1,true); if(e.key==='ArrowLeft') go(i-1,true);
  });
  var x0=null;
  document.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>44) go(dx<0?i+1:i-1,true);
  },{passive:true});
})();
</script>
</body>
</html>
