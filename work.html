<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Loud Haus</title>
<meta name="description" content="Selected brand partnerships across music, retail and entertainment.">
<meta property="og:title" content="Work — Loud Haus">
<meta property="og:image" content="https://zorian.github.io/loudhaus/img/og.jpg">
<meta name="theme-color" content="#EDE8E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234A0D19'/%3E%3Ccircle cx='50' cy='58' r='20' fill='%23EDE8E2'/%3E%3C/svg%3E">
</head>
<body>
<main class="page"><div class="wrap">
<h1 class="big" style="margin-top:clamp(28px,5vw,60px)">Work</h1>

<div class="sv">
  <div class="sv-list" id="list"></div>
  <div>
    <div class="sv-stage" id="stage"><img id="img" alt=""></div>
    <div class="sv-bar">
      <button type="button" id="prev" aria-label="Previous image">&#8592;</button>
      <button type="button" id="next" aria-label="Next image">&#8594;</button>
      <span class="who" id="who" aria-live="polite"></span>
      <span class="num" id="num"></span>
    </div>
  </div>
</div>

<footer>
  <span>Loud Haus &mdash; Brand Partnerships</span>
  <span>London</span>
  <span>&copy; 2026 Loud Haus. All rights reserved.</span>
</footer>
</div></main>

<script src="menu.js"></script>
<script>
(function(){
  var PROJECTS=[["GQ Men of the Year", ["gq-wall", "gq-wall-2", "gq-arrival", "gq-portrait", "gq-detail"]], ["Krept x White Claw", ["wc-krept-claw", "wc-krept-stage", "wc-guests", "wc-clawmachine", "wc-canwall", "wc-neon", "wc-cans"]], ["Dami Hope x Snowbunny", ["sb-wall", "sb-floor", "sb-bumbu", "sb-render"]], ["British Museum Couture Fashion Event", []], ["Black British Comedy Awards", []]];
  var list=document.getElementById('list'), stage=document.getElementById('stage'),
      img=document.getElementById('img'), who=document.getElementById('who'),
      num=document.getElementById('num'),
      prev=document.getElementById('prev'), next=document.getElementById('next'),
      p=0, i=0, note=null;

  PROJECTS.forEach(function(pr,n){
    var b=document.createElement('button'); b.type='button';
    var count=pr[1].length ? pr[1].length+' image'+(pr[1].length>1?'s':'') : 'Sponsorship &amp; partnerships';
    b.innerHTML=pr[0]+'<span>'+count+'</span>';
    b.addEventListener('click',function(){ pick(n); });
    list.appendChild(b);
  });

  function preload(k){
    var s=PROJECTS[p][1]; if(!s.length) return;
    var q=new Image(); q.src='img/'+s[(k+s.length)%s.length]+'.webp';
  }

  function render(){
    var pr=PROJECTS[p], shots=pr[1];
    if(note){ note.remove(); note=null; }
    if(!shots.length){
      img.style.display='none';
      note=document.createElement('p'); note.className='sv-note'; note.textContent=pr[0];
      stage.appendChild(note);
      who.textContent=pr[0]; num.textContent='';
      prev.disabled=true; next.disabled=true;
      return;
    }
    prev.disabled=false; next.disabled=false;
    img.style.display='';
    stage.classList.add('swap');
    var src='img/'+shots[i]+'.webp';
    var pre=new Image();
    pre.onload=pre.onerror=function(){
      img.src=src; img.alt=pr[0];
      who.textContent=pr[0]; num.textContent=(i+1)+' / '+shots.length;
      stage.classList.remove('swap');
      preload(i+1); preload(i-1);
    };
    pre.src=src;
  }

  function pick(n){
    Array.prototype.forEach.call(list.children,function(c){ c.removeAttribute('aria-current'); });
    list.children[n].setAttribute('aria-current','true');
    p=n; i=0; render();
  }
  function step(d){
    var shots=PROJECTS[p][1]; if(!shots.length) return;
    i=(i+d+shots.length)%shots.length; render();
  }
  prev.addEventListener('click',function(){ step(-1); });
  next.addEventListener('click',function(){ step(1); });

  document.addEventListener('keydown',function(e){
    var ov=document.getElementById('overlay');
    if(ov && !ov.hidden) return;
    if(e.key==='ArrowLeft') step(-1);
    if(e.key==='ArrowRight') step(1);
  });

  var x0=null,y0=null;
  stage.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(x0===null) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
  },{passive:true});

  pick(0);
})();
</script>
</body>
</html>
