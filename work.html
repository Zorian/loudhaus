<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Loud Haus</title>
<meta name="description" content="Selected brand partnerships across music, retail and entertainment.">
<meta property="og:title" content="Work — Loud Haus">
<meta property="og:image" content="https://zorian.github.io/loudhaus/img/og.jpg">
<meta name="theme-color" content="#EDE8E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234A0D19'/%3E%3Ccircle cx='50' cy='58' r='20' fill='%23EDE8E2'/%3E%3C/svg%3E">
</head>
<body>
<main class="page"><div class="wrap">
<h1 class="big" style="margin-top:clamp(28px,5vw,60px)">Work</h1>

<div class="gallery">
  <div class="viewer">
    <button class="arrow" type="button" id="prev" aria-label="Previous image">&#8592;</button>
    <div class="frame" id="frame"><img id="gimg" alt=""></div>
    <button class="arrow" type="button" id="next" aria-label="Next image">&#8594;</button>
  </div>
  <div class="arrows-m">
    <button class="arrow" type="button" id="prevM" aria-label="Previous image">&#8592;</button>
    <button class="arrow" type="button" id="nextM" aria-label="Next image">&#8594;</button>
  </div>
  <div class="gal-meta">
    <h2 id="gtitle" aria-live="polite"></h2>
    <span class="num" id="gnum"></span>
  </div>
</div>

<ul class="textlist">
  <li>British Museum Couture Fashion Event</li>
  <li>Black British Comedy Awards</li>
</ul>

<footer>
  <span>Loud Haus &mdash; Brand Partnerships</span>
  <span>London</span>
  <span>&copy; 2026 Loud Haus. All rights reserved.</span>
</footer>
</div></main>

<script src="menu.js"></script>
<script>
(function(){
  var shots=[["gq-wall", "GQ Men of the Year"], ["gq-wall-2", "GQ Men of the Year"], ["gq-arrival", "GQ Men of the Year"], ["gq-portrait", "GQ Men of the Year"], ["gq-detail", "GQ Men of the Year"], ["wc-krept-claw", "Krept x White Claw"], ["wc-krept-stage", "Krept x White Claw"], ["wc-guests", "Krept x White Claw"], ["wc-clawmachine", "Krept x White Claw"], ["wc-canwall", "Krept x White Claw"], ["wc-neon", "Krept x White Claw"], ["wc-cans", "Krept x White Claw"], ["sb-wall", "Dami Hope x Snowbunny"], ["sb-floor", "Dami Hope x Snowbunny"], ["sb-bumbu", "Dami Hope x Snowbunny"], ["sb-render", "Dami Hope x Snowbunny"]];
  var frame=document.getElementById('frame'), img=document.getElementById('gimg'),
      title=document.getElementById('gtitle'), num=document.getElementById('gnum'), i=0;

  function preload(n){
    var s=shots[(n+shots.length)%shots.length];
    var p=new Image(); p.src='img/'+s[0]+'.webp';
  }
  function show(n){
    i=(n+shots.length)%shots.length;
    var s=shots[i];
    frame.classList.add('swap');
    var pre=new Image();
    pre.onload=pre.onerror=function(){
      img.src='img/'+s[0]+'.webp'; img.alt=s[1];
      title.textContent=s[1]; num.textContent=(i+1)+' / '+shots.length;
      frame.classList.remove('swap');
      preload(i+1); preload(i-1);
    };
    pre.src='img/'+s[0]+'.webp';
  }
  ['prev','prevM'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(){ show(i-1); });
  });
  ['next','nextM'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(){ show(i+1); });
  });
  document.addEventListener('keydown',function(e){
    if(document.getElementById('overlay') && !document.getElementById('overlay').hidden) return;
    if(e.key==='ArrowLeft') show(i-1);
    if(e.key==='ArrowRight') show(i+1);
  });
  var x0=null,y0=null;
  frame.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  frame.addEventListener('touchend',function(e){
    if(x0===null) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)) show(dx<0?i+1:i-1);
  },{passive:true});
  show(0);
})();
</script>
</body>
</html>
